# Dependabot: dependency and GitHub Actions version updates.
# Security alerts (advisory DB) are additionally enabled in repo settings —
# see security_and_analysis (dependabot_security_updates, secret_scanning).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Only semver-compatible updates are batched; major bumps arrive as
      # individual reviewable PRs (a "*" group once produced an unbuildable
      # axum-0.8 + sqlx-0.9 + jsonwebtoken-11 batch — see closed PR #8).
      rust-dependencies:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # rsa enters the lockfile only as a feature-graph artifact of sqlx's
      # macro umbrella (see deny.toml) — never compiled. Keep it pinned.
      - dependency-name: "rsa"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/integrations/sycope"
    schedule:
      interval: monthly
