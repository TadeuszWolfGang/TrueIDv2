name: glibc-compat

permissions:
  contents: read


on:
  push:
    branches: [main]
  pull_request:

jobs:
  glibc-compat:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build builder image (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 --target builder --load -t trueid-builder:glibc236 .

      - name: Verify max required GLIBC <= 2.36
        run: |
          docker run --rm --entrypoint /bin/sh trueid-builder:glibc236 -c '
            set -eu
            max_glibc="$(strings /out/trueid-engine | grep -o "GLIBC_[0-9.]\+" | sort -Vu | tail -n 1)"
            echo "max_glibc=${max_glibc}"
            [ -n "${max_glibc}" ]
            max_ver="${max_glibc#GLIBC_}"
            dpkg --compare-versions "${max_ver}" le "2.36"
          '

      - name: Build runtime image (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 --target runtime --load -t trueid-runtime:glibc236 .

      - name: Runtime image metadata
        run: |
          cid="$(docker create trueid-runtime:glibc236)"
          cleanup() {
            docker rm -f "${cid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker image inspect trueid-runtime:glibc236 --format 'user={{.Config.User}} cmd={{json .Config.Cmd}}'
          docker cp "${cid}:/usr/local/bin/trueid-engine" "${RUNNER_TEMP}/trueid-engine"
          docker cp "${cid}:/usr/local/bin/trueid-probe" "${RUNNER_TEMP}/trueid-probe"
          docker cp "${cid}:/app/migrations" "${RUNNER_TEMP}/migrations"

          test -x "${RUNNER_TEMP}/trueid-engine"
          test -x "${RUNNER_TEMP}/trueid-probe"
          find "${RUNNER_TEMP}/migrations" -type f | grep -q .

      - name: Binary ldd inspection
        run: |
          docker run --rm --entrypoint /bin/sh trueid-builder:glibc236 -c '
            set -eu
            ldd /out/trueid-engine
            ldd /out/trueid
            ldd /out/trueid-web
            ldd /out/trueid-probe
          '

      - name: Smoke test trueid-engine
        run: |
          tmpdir="$(mktemp -d)"
          chmod 0777 "${tmpdir}"
          cid="$(docker run -d --rm \
            -v "${tmpdir}:/app/data" \
            -e DATABASE_URL=sqlite:///app/data/net-identity.db?mode=rwc \
            -e RUST_LOG=info \
            -e RADIUS_SECRET=glibc-compat-secret \
            -e ENGINE_SERVICE_TOKEN=ci-smoke-service-token-0123456789abcdef \
            -e RADIUS_BIND=0.0.0.0:1813 \
            -e AD_SYSLOG_BIND=0.0.0.0:5514 \
            -e DHCP_SYSLOG_BIND=0.0.0.0:5516 \
            -e ADMIN_HTTP_BIND=0.0.0.0:9090 \
            trueid-runtime:glibc236 /usr/local/bin/trueid-engine)"
          cleanup() {
            status=$?
            if [ "${status}" -ne 0 ]; then
              docker logs "${cid}" || true
            fi
            docker rm -f "${cid}" >/dev/null 2>&1 || true
            rm -rf "${tmpdir}"
            exit "${status}"
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 20); do
            if docker exec "${cid}" /usr/local/bin/trueid-probe tcp 127.0.0.1:9090 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          [ "${ready}" = "1" ]
          test -s "${tmpdir}/net-identity.db"
          docker logs "${cid}" | grep -q "Initializing database"

      - name: Smoke test native HTTPS web
        run: |
          set -euo pipefail
          umask 077
          tmpdir="$(mktemp -d)"
          cid=""
          cleanup() {
            status=$?
            if [ -n "${cid}" ]; then
              if [ "${status}" -ne 0 ]; then
                docker logs "${cid}" || true
              fi
              docker rm -f "${cid}" >/dev/null 2>&1 || true
            fi
            sudo rm -rf -- "${tmpdir}"
            exit "${status}"
          }
          trap cleanup EXIT

          mkdir "${tmpdir}/data" "${tmpdir}/tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "${tmpdir}/ca.key" -out "${tmpdir}/ca.crt" -days 1 \
            -subj '/CN=TrueID CI test CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "${tmpdir}/tls/server.key" -out "${tmpdir}/server.csr" \
            -subj '/CN=localhost'
          printf '%s\n' \
            'subjectAltName=IP:127.0.0.1,DNS:localhost' \
            'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature' \
            'extendedKeyUsage=serverAuth' > "${tmpdir}/server.ext"
          openssl x509 -req -in "${tmpdir}/server.csr" \
            -CA "${tmpdir}/ca.crt" -CAkey "${tmpdir}/ca.key" -CAcreateserial \
            -out "${tmpdir}/tls/server.crt" -days 1 -extfile "${tmpdir}/server.ext"
          openssl verify -CAfile "${tmpdir}/ca.crt" \
            -verify_ip 127.0.0.1 "${tmpdir}/tls/server.crt"

          # Keep the CA readable by the runner; only leaf material enters the container.
          # Match distroless nonroot (65532) without overriding the runtime image user.
          sudo chown -R 65532:65532 "${tmpdir}/data" "${tmpdir}/tls"
          {
            printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'ENGINE_SERVICE_TOKEN=%s\n' "$(openssl rand -hex 32)"
            printf 'CONFIG_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)"
            printf 'ARGON2_PEPPER=%s\n' "$(openssl rand -hex 32)"
            printf 'TRUEID_ADMIN_USER=ci-admin\n'
            printf 'TRUEID_ADMIN_PASS=Aa9!%s\n' "$(openssl rand -hex 16)"
          } > "${tmpdir}/web.env"

          cid="$(docker run -d \
            -p 127.0.0.1::3000 \
            -v "${tmpdir}/data:/app/data" \
            -v "${tmpdir}/tls:/app/tls:ro" \
            --env-file "${tmpdir}/web.env" \
            -e TRUEID_DEV_MODE=false \
            -e DATABASE_URL=sqlite:///app/data/net-identity.db?mode=rwc \
            -e ENGINE_API_URL=http://127.0.0.1:8080 \
            -e HTTP_BIND=0.0.0.0:3000 \
            -e TLS_CERT=/app/tls/server.crt \
            -e TLS_KEY=/app/tls/server.key \
            trueid-runtime:glibc236 /usr/local/bin/trueid-web)"
          endpoint="$(docker port "${cid}" 3000/tcp)"
          ready=0
          for _ in $(seq 1 20); do
            code="$(curl --silent --show-error --connect-timeout 1 --max-time 2 \
              --cacert "${tmpdir}/ca.crt" --output /dev/null --write-out '%{http_code}' \
              "https://${endpoint}/health" 2>/dev/null || true)"
            if [ "${code}" = "200" ]; then
              ready=1
              break
            fi
            [ "$(docker inspect --format '{{.State.Running}}' "${cid}")" = "true" ] || break
            sleep 1
          done
          [ "${ready}" = "1" ]
          sudo test -s "${tmpdir}/data/net-identity.db"
          [ "$(sudo stat -c '%u' "${tmpdir}/data/net-identity.db")" = "65532" ]
