# Temporary one-shot qualification. No runtime result is asserted by this source.
name: live-auth-qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up existing Docker Buildx
        timeout-minutes: 2
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Prepare isolated private inputs and empty report directory
        id: paths
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PYTHON'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import sys
          import tempfile
          import zlib

          PAYLOAD_SHA256 = "a5aba2cfc66a0234a50936d4da5a55cbea0efdd2ff4965326f3b1e576d1bea7c"
          PAYLOAD = """"""
          CANDIDATE_SHA256 = "34c584c1036e0e51000e9b57244e40b0c483f117aa8a4ee99d0ad913a02a0682"
          NAMES = {"controls_bootstrap.py", "adapter.py", "safe_artifact_checker.py", "step_entry.py",
                   "candidate-source-approval.json", "adapter-source-approval.json",
                   "corpus/corpus-bundle-manifest.json", "corpus/cases.json", "corpus/baseline-5.json",
                   "corpus/minimal-2.json", "corpus/limit-256.json"}


          def need(ok):
              if not ok:
                  raise RuntimeError("ONE_SHOT_PREPARATION_REJECTED")


          def fresh_file(path, raw, mode):
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, mode)
              try:
                  view = memoryview(raw)
                  while view:
                      count = os.write(fd, view)
                      need(count > 0)
                      view = view[count:]
                  os.fsync(fd)
                  os.fchmod(fd, mode)
              finally:
                  os.close(fd)


          os.umask(0o077)
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          need(root.is_dir() and temporary.is_dir() and not temporary.is_relative_to(root))
          candidate = root / "scripts/ci-live-auth-acceptance.py"
          need(candidate.resolve(strict=True) == candidate)
          fd = os.open(candidate, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW | os.O_CLOEXEC)
          try:
              before = os.fstat(fd)
              need(stat.S_ISREG(before.st_mode) and before.st_uid == os.geteuid() and
                   before.st_nlink == 1 and 0 < before.st_size <= 1048576)
              chunks = []
              count = 0
              while True:
                  chunk = os.read(fd, min(65536, 1048577 - count))
                  if not chunk:
                      break
                  chunks.append(chunk)
                  count += len(chunk)
                  need(count <= 1048576)
              raw = b"".join(chunks)
              fields = lambda s: (s.st_dev, s.st_ino, s.st_mode, s.st_uid, s.st_gid,
                                  s.st_nlink, s.st_size, s.st_mtime_ns, s.st_ctime_ns)
              need(fields(os.fstat(fd)) == fields(before) == fields(candidate.lstat()) and len(raw) == before.st_size and
                   hashlib.sha256(raw).hexdigest() == CANDIDATE_SHA256)
          finally:
              os.close(fd)
          compressed = base64.b64decode(PAYLOAD, validate=True)
          need(len(compressed) <= 1048576 and hashlib.sha256(compressed).hexdigest() == PAYLOAD_SHA256)
          decoder = zlib.decompressobj()
          decoded = decoder.decompress(compressed, 2097153)
          need(len(decoded) <= 2097152 and decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail)
          bundle = json.loads(decoded)
          need(type(bundle) is dict and set(bundle) == NAMES)
          reports = Path(tempfile.mkdtemp(prefix="trueid-auth-reports-", dir=temporary)).resolve(strict=True)
          inputs = Path(tempfile.mkdtemp(prefix="trueid-auth-inputs-", dir=temporary)).resolve(strict=True)
          reports.chmod(0o700)
          inputs.chmod(0o700)
          need(not reports.is_relative_to(root) and not inputs.is_relative_to(root) and
               not reports.is_relative_to(inputs) and not inputs.is_relative_to(reports))
          for name, record in bundle.items():
              need(type(record) is dict and set(record) == {"sha256", "bytes", "base64"} and
                   type(record["bytes"]) is int and 0 < record["bytes"] <= 1048576)
              raw = base64.b64decode(record["base64"], validate=True)
              need(len(raw) == record["bytes"] and hashlib.sha256(raw).hexdigest() == record["sha256"])
              path = inputs / name
              path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              fresh_file(path, raw, 0o400)
          info = reports.lstat()
          identity = {"device": info.st_dev, "inode": info.st_ino, "uid": info.st_uid}
          state = {"source_root": str(root), "report_dir": str(reports), "created_identity": identity}
          # This identity record is outside the report directory and predates both captures.
          fresh_file(inputs / "state.json", json.dumps(state, sort_keys=True, separators=(",", ":")).encode(), 0o600)
          python = Path(sys.executable).resolve(strict=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in (("inputs", inputs), ("reports", reports), ("python", python), ("source_root", root)):
                  text = str(value)
                  need("\n" not in text and "\r" not in text)
                  output.write(name + "=" + text + "\n")
          PYTHON

      - name: Qualify the independent native-report decoder
        id: controls
        timeout-minutes: 6
        shell: bash
        env:
          INPUTS: ${{ steps.paths.outputs.inputs }}
          HOST_PYTHON: ${{ steps.paths.outputs.python }}
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PYTHON'
          import json, shutil, stat, sys
          from pathlib import Path
          def metadata(path):
              try:
                  item = Path(path).resolve(strict=True).stat()
                  return {"bytes": item.st_size, "nlink": item.st_nlink,
                          "regular": stat.S_ISREG(item.st_mode)}
              except (OSError, TypeError):
                  return None
          docker = shutil.which("docker")
          plugins = [Path.home() / ".docker/cli-plugins/docker-buildx",
                     Path("/usr/libexec/docker/cli-plugins/docker-buildx"),
                     Path("/usr/lib/docker/cli-plugins/docker-buildx"),
                     Path("/usr/local/lib/docker/cli-plugins/docker-buildx")]
          print(json.dumps({"scope": "S4_HOST_TOOL_METADATA_ONLY",
                            "host_python": list(sys.version_info[:3]),
                            "docker": metadata(docker),
                            "buildx_candidates": [metadata(path) for path in plugins]}, sort_keys=True))
          PYTHON
          env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" LANG=C.UTF-8 \
            "$HOST_PYTHON" -I -B "$INPUTS/step_entry.py" verify
          set +e
          env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" LANG=C.UTF-8 \
            "$HOST_PYTHON" -I -B "$INPUTS/step_entry.py" controls >/dev/null 2>&1
          actual_exit=$?
          set -e
          env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" LANG=C.UTF-8 \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" "$HOST_PYTHON" -I -B "$INPUTS/step_entry.py" \
            post controls "$actual_exit"
          exit "$actual_exit"

      - name: Run the native-auth producer once
        id: producer
        if: ${{ success() && steps.controls.outcome == 'success' && steps.controls.outputs.qualification == 'true' }}
        timeout-minutes: 102
        shell: bash
        env:
          INPUTS: ${{ steps.paths.outputs.inputs }}
          HOST_PYTHON: ${{ steps.paths.outputs.python }}
          SOURCE_ROOT: ${{ steps.paths.outputs.source_root }}
          REPORTS: ${{ steps.paths.outputs.reports }}
        run: |
          set -euo pipefail
          umask 077
          env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" LANG=C.UTF-8 \
            "$HOST_PYTHON" -I -B "$INPUTS/step_entry.py" verify
          set +e
          env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" LANG=C.UTF-8 \
            "$HOST_PYTHON" -I -B "$SOURCE_ROOT/scripts/ci-live-auth-acceptance.py" \
            --source-root "$SOURCE_ROOT" --report "$REPORTS/producer-summary.json" \
            --timeout 6000 >/dev/null 2>&1
          actual_exit=$?
          set -e
          env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" LANG=C.UTF-8 \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" "$HOST_PYTHON" -I -B "$INPUTS/step_entry.py" \
            post producer "$actual_exit"
          exit "$actual_exit"

      - name: Check exact safe summaries and preserve qualification failure
        id: safe
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          INPUTS: ${{ steps.paths.outputs.inputs }}
          HOST_PYTHON: ${{ steps.paths.outputs.python }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          PRODUCER_OUTCOME: ${{ steps.producer.outcome }}
        run: |
          set -euo pipefail
          umask 077
          env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" LANG=C.UTF-8 \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" CONTROLS_OUTCOME="$CONTROLS_OUTCOME" \
            PRODUCER_OUTCOME="$PRODUCER_OUTCOME" "$HOST_PYTHON" -I -B \
            "$INPUTS/step_entry.py" artifacts

      - name: Upload only validated safe summary names
        timeout-minutes: 2
        if: ${{ always() && steps.safe.outputs.has-artifacts == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: live-auth-qualification-safe-summaries
          path: |
            ${{ steps.safe.outputs.artifact-dir }}/control-summary.json
            ${{ steps.safe.outputs.artifact-dir }}/producer-summary.json
          if-no-files-found: error
          retention-days: 7
