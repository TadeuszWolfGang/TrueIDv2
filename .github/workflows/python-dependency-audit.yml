                          raise
                      finally:
                          if dfd is not None: os.close(dfd)
                      if len(refs) >= 256:
                          close_ref(ref)
                          raise Failure('OWNED_PROCESS_CAP')
                      refs[ref['identity']] = ref
                      parents[pid] = ref
                      known.add(pid)
                      if process is not None and pid == process.pid and main_ref is None: main_ref = ref

