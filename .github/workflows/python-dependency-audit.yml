              return raw


          def file_bytes(path):
              info = path.lstat()
              need(path.resolve(strict=True) == path and stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and
                   0 < info.st_size <= 1048576, 'SOURCE_REGULAR_BOUND')
              raw = path.read_bytes()
              need(len(raw) == info.st_size, 'SOURCE_CHANGED')
              return raw


          def source_map(checkout, paths):
              result = {}
              for rel in paths:
                  raw = file_bytes(checkout / rel)
                  result[rel] = {'sha256': digest(raw), 'bytes': len(raw)}
              return result


          def inspect(cid, cleanup=False):
              return json.loads(command(['docker', 'inspect', cid], cleanup=cleanup))[0]


          def recover(intent):
              raw = command(['docker', 'ps', '--all', '--no-trunc', '--filter',
                             'label=org.trueid.c02.owner=' + intent['owner'], '--format', '{{.ID}}'], cleanup=True)
              ids = raw.decode('ascii').splitlines()
              need(len(ids) <= 1 and all(re.fullmatch('[0-9a-f]{64}', cid) for cid in ids), 'OWNED_LOOKUP')
              for cid in ids:
                  info = inspect(cid, True)
                  need(info['Name'] == '/' + intent['name'] and info['Image'] == intent['image'] and
                       info['Config']['Labels'].get('org.trueid.c02.owner') == intent['owner'], 'OWNED_IDENTITY')
              return ids


          def retire(intent):
