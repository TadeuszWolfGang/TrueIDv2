                  intent['closed'] = True
                  if not intent['acked']: UNCERTAIN = True
              except BaseException:
                  UNCERTAIN = True
                  raise


          def container(image, project, argv, label, seconds, network='none'):
              owner = secrets.token_hex(16)
              intent = {'owner': owner, 'name': 'trueid-c02-' + owner, 'image': image, 'acked': False, 'closed': False}
              INTENTS.append(intent)  # Before create: interrupted requests can be recovered by exact nonce.
              tail = ['-c', 'umask 077; mkdir -m 0700 /work/home /work/tmp /work/cache; exec "$@"', 'ci',
                      '/usr/bin/env', '-i', 'PATH=/usr/local/bin:/usr/bin:/bin', 'HOME=/work/home', 'TMPDIR=/work/tmp',
                      'LANG=C.UTF-8', 'UV_CACHE_DIR=/work/cache', 'PYTHONDONTWRITEBYTECODE=1',
                      'PYTHONNOUSERSITE=1', 'PYTHONOPTIMIZE=0', *argv]
              config = ['docker', 'create', '--name', intent['name'], '--label', 'org.trueid.c02.owner=' + owner,
                        '--platform', 'linux/amd64', '--init', '--user', '1000:1000', '--log-driver', 'none',
                        '--read-only', '--network', network, '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges',
                        '--pids-limit', '256', '--cpus', '2', '--memory', '3g', '--memory-swap', '3g',
                        '--stop-signal', 'SIGTERM', '--stop-timeout', '20', '--workdir', '/project/integrations/sycope',
                        '--tmpfs', '/work:rw,nosuid,nodev,noexec,size=256m,uid=1000,gid=1000,mode=0700',
                        '--mount', 'type=bind,source=' + str(project) + ',target=/project,readonly',
                        '--entrypoint', '/bin/sh']
              try:
                  cid = command(config + [image] + tail).decode('ascii').strip()
                  intent['acked'] = True
                  need(re.fullmatch('[0-9a-f]{64}', cid) and recover(intent) == [cid], 'CONTAINER_ID')
                  before = inspect(cid)
                  binds = [m for m in before['Mounts'] if m['Type'] == 'bind']
                  need(before['Config']['User'] == '1000:1000' and before['Config']['Cmd'] == tail and
                       before['Config']['Entrypoint'] == ['/bin/sh'] and before['Config']['Tty'] is False and
                       len(binds) == 1 and binds[0]['Destination'] == '/project' and binds[0]['Source'] == str(project) and binds[0]['RW'] is False and
                       before['HostConfig']['ReadonlyRootfs'] is True and before['HostConfig']['NetworkMode'] == network,
                       'CONTAINER_CONFIG')
                  code, raw, stderr, elapsed = capture(['docker', 'start', '--attach', cid], seconds)
                  after = inspect(cid)
                  need(after['Image'] == image and after['State']['Running'] is False and after['State']['Pid'] == 0 and
                       after['State']['OOMKilled'] is False and after['State'].get('Error', '') == '' and
                       type(after['State']['ExitCode']) is int and after['State']['ExitCode'] == code and
                       0 <= code < 126, 'CONTAINER_OUTCOME')
                  return {'kind': label, 'container_id': cid, 'owner': owner, 'network': network,
                          'actual_exit': code, 'client_exit': code, 'elapsed_s': elapsed,
                          'stdout_bytes': len(raw), 'stdout_sha256': digest(raw), 'stderr_bytes': len(stderr),
                          'stderr_sha256': digest(stderr)}, raw
              finally:
                  retire(intent)


          def write_receipt(path, value):
              raw = canonical(value) + b'\n'
              need(len(raw) <= 262144, 'RECEIPT_CAP')
              temporary = path.with_name(path.name + '.' + secrets.token_hex(8) + '.new')
              fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(raw)
                  stream.flush()
                  os.fsync(stream.fileno())
              temporary.chmod(0o600)
              os.replace(temporary, path)


          def main():
              global ENV, UNCERTAIN
              for number in (signal.SIGINT, signal.SIGTERM, signal.SIGHUP): signal.signal(number, interrupted)
              os.umask(0o077)
              runner = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              receipt_path = runner / 'trueid-python-dependency-audit.json'
              receipt = {'schemaVersion': 1, 'status': 'FAIL', 'category': 'BOOTSTRAP', 'setup': {'status': 'NOT_RUN'},
                         'stages': {n: {'status': 'NOT_RUN'} for n in ('unit', 'lock', 'osv')},
                         'source_files': {}, 'source_preserved': None, 'tools': {}, 'cleanup': False, 'cancelled': False,
                         'hosted_dependabot_updater': 'NOT_RUN'}
              write_receipt(receipt_path, receipt)  # Exists even if subsequent setup fails.
              root = Path(tempfile.mkdtemp(prefix='trueid-c02-ci-', dir=runner))
              need(root.parent == runner and root.resolve(strict=True) == root, 'OWNED_STAGING')
              nonce = secrets.token_hex(16)
              tag = 'trueid-c02-sdk:' + nonce
              tag_owned = False
              build_in_flight = False
              image = None
              originals = None
              project = None
              files = None
              checkout = Path.cwd().resolve(strict=True)
              ENV = {'PATH': os.environ['PATH'], 'HOME': str(root / 'home'), 'DOCKER_CONFIG': str(root / 'docker-config'),
                     'LANG': 'C.UTF-8', 'DOCKER_BUILDKIT': '1', 'GIT_OPTIONAL_LOCKS': '0'}
              try:
                  (root / 'home').mkdir(); (root / 'docker-config').mkdir()
                  receipt['tools']['host_capture_probes'] = capture_probes()
                  # Keep only the action-installed executable, never the user's Docker credentials.
                  plugin_dirs = [Path(os.environ.get('DOCKER_CONFIG', str(Path(os.environ['HOME']) / '.docker'))) / 'cli-plugins',
                                 Path('/usr/libexec/docker/cli-plugins'), Path('/usr/lib/docker/cli-plugins'),
                                 Path('/usr/local/libexec/docker/cli-plugins'), Path('/usr/local/lib/docker/cli-plugins')]
                  plugins = [d / 'docker-buildx' for d in plugin_dirs if (d / 'docker-buildx').is_file() and
                             os.access(d / 'docker-buildx', os.X_OK)]
                  need(plugins, 'BUILDX_PLUGIN_REQUIRED')
                  plugin_dir = root / 'docker-config/cli-plugins'; plugin_dir.mkdir(mode=0o700)
                  shutil.copyfile(plugins[0].resolve(strict=True), plugin_dir / 'docker-buildx')
                  (plugin_dir / 'docker-buildx').chmod(0o500)
                  buildx_version = command(['docker', 'buildx', 'version'], 30)
                  need(re.fullmatch(rb'[ -~]{1,512}\n?', buildx_version) is not None, 'BUILDX_VERSION')
                  receipt['tools']['buildx_version_sha256'] = digest(buildx_version)
                  contract = {'__name__': 'trusted_CI_unit_contract'}
                  exec(compile(CONTRACT_SOURCE, '<workflow-unit-contract>', 'exec'), contract)
                  osv = {'__name__': 'trusted_CI_OSV_contract'}
                  exec(compile(OSV_SOURCE, '<workflow-OSV-contract>', 'exec'), osv)
                  context = root / 'context'; context.mkdir()
                  project = root / 'project'; project.mkdir()
                  chosen = sorted({p.relative_to(checkout).as_posix() for folder in ('sycope', 'integrations/sycope')
                                   for p in (checkout / folder).glob('*.py')} |
                                  {'integrations/sycope/Dockerfile', 'integrations/sycope/pyproject.toml',
                                   'integrations/sycope/uv.lock', 'integrations/sycope/.python-version'})
                  need(any(p.startswith('sycope/') for p in chosen) and any(
                       p.startswith('integrations/sycope/') and p.endswith('.py') for p in chosen), 'BUILD_CONTEXT_EMPTY')
                  all_paths = sorted(set(chosen) | set(PROJECT_FILES))
                  originals = source_map(checkout, all_paths)
                  need(sum(row['bytes'] for row in originals.values()) <= 8388608, 'PUBLIC_CONTEXT_CAP')
                  for rel in chosen:
                      need(not any(part == '.git' or part.startswith('.env') for part in Path(rel).parts), 'PUBLIC_CONTEXT_PATH')
                      destination = context / rel; destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(file_bytes(checkout / rel))
                  files = {rel: originals[rel] for rel in PROJECT_FILES}
                  receipt['source_files'] = files
                  for rel in PROJECT_FILES:
                      destination = project / rel; destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(file_bytes(checkout / rel)); destination.chmod(0o444)
                  ast.parse(file_bytes(project / 'scripts/test_audit_python_lock.py'), feature_version=(3, 11))
                  expected, _classes = contract['derive_expected_ids'](file_bytes(project / 'scripts/test_audit_python_lock.py'))
                  manifest = canonical({'module': 'test_audit_python_lock', 'files': files, 'expected_ids': list(expected)})
                  need(len(manifest) <= 65536, 'MANIFEST_CAP')
                  for path in [project, *project.rglob('*')]:
                      if path.is_dir(): path.chmod(0o555)
                  command(['sudo', '-n', 'chown', '-R', '0:0', str(project)])
                  need(command(['docker', 'image', 'ls', '--filter', 'reference=' + tag, '--format', '{{.ID}}']).strip() == b'',
                       'IMAGE_TAG_ALREADY_EXISTS')
                  tag_owned = True
                  build_in_flight = True
                  code, _build_out, _build_err, elapsed = capture(['docker', 'build', '--platform', 'linux/amd64', '--pull',
                      '--no-cache', '--network', 'default', '--label', 'org.trueid.c02.image=' + nonce,
                      '-f', str(context / 'integrations/sycope/Dockerfile'), '-t', tag, str(context)],
                      1200, stdout_cap=2097152, stderr_cap=2097152)
                  build_in_flight = False
                  receipt['setup'] = {'status': 'FAIL', 'build_exit': code, 'elapsed_s': elapsed, 'image_id': None,
                                      'public_context_sha256': digest(canonical(originals))}
                  need(code == 0, 'SDK_BUILD')
                  image_info = json.loads(command(['docker', 'image', 'inspect', tag]))[0]
                  image = image_info['Id']
                  need(re.fullmatch('sha256:[0-9a-f]{64}', image) and
                       image_info['Config']['Labels'].get('org.trueid.c02.image') == nonce, 'IMAGE_IDENTITY')
                  receipt['setup'].update(status='PASS', image_id=image, owned_tag=tag, owner=nonce)
                  need(DRIVER_SOURCE.count("CONTRACT_SOURCE='__EMBEDDED_QUALIFIED_CONTRACT__'") == 1, 'DRIVER_EMBEDDING')
                  program = DRIVER_SOURCE.replace("CONTRACT_SOURCE='__EMBEDDED_QUALIFIED_CONTRACT__'",
                                                  'CONTRACT_SOURCE=' + repr(CONTRACT_SOURCE))
                  need(program != DRIVER_SOURCE and len(program.encode()) <= 65536, 'DRIVER_EMBEDDING')
                  manifest_arg = base64.b64encode(manifest).decode('ascii')
                  unit_args = [PYTHON, '-I', '-B', '-c', program, manifest_arg, digest(manifest)]
                  for phase in ('unit', 'lock', 'osv'):
                      if CANCELLED or UNCERTAIN: break
                      stage = {'status': 'FAIL', 'category': 'INTERNAL', 'commands': []}
                      receipt['stages'][phase] = stage
                      try:
                          if phase == 'unit':
                              outcome, raw = container(image, project, unit_args, 'unit', 180)
                              stage['commands'].append(outcome)
                              report = contract['strict_json'](raw)
                              count_keys = {'starts','stops','successes','failures','errors','skips','expected_failures','unexpected_successes',
                                            'subtests','subtest_successes','subtest_failures','subtest_errors','subtest_skips'}
                              counts = report.get('counts') if type(report) is dict else None
                              if type(counts) is dict and set(counts) == count_keys and all(type(v) is int and 0 <= v <= 4096 for v in counts.values()):
                                  stage.update(counts=counts, counts_validation='OBSERVED_UNACCEPTED')
                              accepted = contract['validate_unit_report'](raw, actual_exit=outcome['actual_exit'],
                                                                         expected_ids=expected, source_files=files)
                              stage.update(status='PASS', category=None, methods=accepted['methods'], subtests=accepted['subtests'],
                                           counts=report['counts'], counts_validation='ACCEPTED', expected_ids_sha256=digest(canonical(list(expected))))
                          elif phase == 'lock':
                              metadata_code = ('import hashlib,json,os,sys;from pathlib import Path;'
                                  'print(json.dumps({"version":list(sys.version_info[:3]),"uid":os.getuid(),"gid":os.getgid(),'
                                  '"isolated":bool(sys.flags.isolated),"no_bytecode":sys.dont_write_bytecode,"optimize":sys.flags.optimize,'
                                  '"executable_sha256":hashlib.sha256(Path(sys.executable).read_bytes()).hexdigest()}))')
                              outcome, raw = container(image, project, [PYTHON, '-I', '-B', '-c', metadata_code], 'python', 30)
                              stage['commands'].append(outcome); need(outcome['actual_exit'] == 0, 'PYTHON_VERSION')
                              metadata = contract['strict_json'](raw)
                              need(type(metadata) is dict and set(metadata) == {'version','uid','gid','isolated','no_bytecode','optimize','executable_sha256'} and
                                   type(metadata['version']) is list and len(metadata['version']) == 3 and
                                   all(type(v) is int and v >= 0 for v in metadata['version']) and metadata['version'][:2] == [3,11] and
                                   type(metadata['uid']) is type(metadata['gid']) is int and metadata['uid'] == metadata['gid'] == 1000 and
                                   metadata['isolated'] is metadata['no_bytecode'] is True and type(metadata['optimize']) is int and metadata['optimize'] == 0 and
                                   type(metadata['executable_sha256']) is str and re.fullmatch('[0-9a-f]{64}', metadata['executable_sha256']), 'PYTHON_IDENTITY')
                              receipt['tools']['python'] = metadata
                              outcome, raw = container(image, project, ['/bin/uv', '--version'], 'uv-version', 30)
                              stage['commands'].append(outcome); need(outcome['actual_exit'] == 0, 'UV_VERSION')
                              version = re.fullmatch(rb'uv (0\.12\.8)(?: \([ -~]{1,128}\))?\n?', raw)
                              need(version is not None, 'UV_VERSION')
                              receipt['tools']['uv_version'] = version.group(1).decode('ascii')
                              outcome, raw = container(image, project, ['/bin/uv', 'lock', '--help'], 'uv-help', 30)
                              stage['commands'].append(outcome)
                              need(outcome['actual_exit'] == 0 and b'--check' in raw and b'--python' in raw, 'UV_CLI')
                              receipt['tools']['uv_lock_help_sha256'] = digest(raw)
                              outcome, _raw = container(image, project, ['/bin/uv', 'lock', '--check', '--python', PYTHON], 'lock-check', 90)
                              stage['commands'].append(outcome); need(outcome['actual_exit'] == 0, 'LOCK_CHECK')
                              stage.update(status='PASS', category=None)
                          else:
                              outcome, raw = container(image, project, [PYTHON, '-I', '-B', '/project/scripts/audit-python-lock.py',
                                  '--lock', '/project/integrations/sycope/uv.lock'], 'osv', 90, network='bridge')
                              stage['commands'].append(outcome)
                              safe = osv['validate_osv_report'](raw, outcome['actual_exit'],
                                  file_bytes(project / 'integrations/sycope/uv.lock'), file_bytes(project / 'integrations/sycope/pyproject.toml'))
                              stage['report'] = safe
                              stage.update(status='PASS' if outcome['actual_exit'] == 0 and safe['status'] == 'CLEAN' else 'FAIL',
                                           category=None if outcome['actual_exit'] == 0 and safe['status'] == 'CLEAN' else safe['category'] or 'FINDINGS')
                      except BaseException as error:
                          dto_codes = {'SCANNER_INPUT','SCANNER_EXIT','SCANNER_JSON','SCANNER_SCHEMA','SCANNER_COVERAGE','SCANNER_ADVISORIES'}
                          stage['category'] = (error.code if type(error) is Failure else
                              error.args[0] if phase == 'osv' and type(error) is ValueError and len(error.args) == 1 and error.args[0] in dto_codes
                              else 'UNIT_REPORT' if phase == 'unit' else 'STAGE_REPORT')
                      need(source_map(checkout, all_paths) == originals and source_map(project, PROJECT_FILES) == files, 'SOURCE_CHANGED')
                  receipt['category'] = None
              except BaseException as error:
                  receipt['category'] = error.code if type(error) is Failure else 'INTERNAL'
                  if receipt['setup']['status'] != 'PASS': receipt['setup']['status'] = 'FAIL'
              finally:
                  cleanup_ok = True
                  for intent in reversed(INTENTS):
                      try: retire(intent)
                      except BaseException: cleanup_ok = False
                  if build_in_flight: UNCERTAIN = True
                  if tag_owned:
                      try:
                          remaining = command(['docker', 'image', 'ls', '--filter', 'reference=' + tag, '--format', '{{.ID}}'], cleanup=True)
                          if remaining.strip():
                              info = json.loads(command(['docker', 'image', 'inspect', tag], cleanup=True))[0]
                              need(info['Config']['Labels'].get('org.trueid.c02.image') == nonce and
                                   (image is None or info['Id'] == image), 'OWNED_IMAGE_IDENTITY')
                              command(['docker', 'image', 'rm', tag], cleanup=True)
                          need(command(['docker', 'image', 'ls', '--filter', 'reference=' + tag, '--format', '{{.ID}}'], cleanup=True).strip() == b'',
                               'OWNED_IMAGE_REMAINS')
                      except BaseException: cleanup_ok = False
                  try:
                      if originals is not None: need(source_map(checkout, sorted(originals)) == originals, 'SOURCE_CHANGED')
                      if project is not None and files is not None:
                          need(source_map(project, PROJECT_FILES) == files, 'SOURCE_CHANGED')
                          receipt['source_preserved'] = True
                      if cleanup_ok and not UNCERTAIN and all(i['closed'] for i in INTENTS):
                          need(root.parent == runner and root.resolve(strict=True) == root and not root.is_symlink(), 'OWNED_STAGING')
                          command(['sudo', '-n', 'rm', '-rf', '--', str(root)], 30, cleanup=True)
                          need(not root.exists(), 'STAGING_REMAINS')
                      else:
                          cleanup_ok = False  # Retain this attempt's work while ownership/drain is unknown.
                  except BaseException:
                      cleanup_ok = False
                      receipt['source_preserved'] = False
                  receipt['cleanup'] = cleanup_ok and not UNCERTAIN and all(i['closed'] for i in INTENTS)
                  # Cleanup is finished; subsequent cancellation must retain a nonzero process exit.
                  signal.signal(signal.SIGINT, signal.default_int_handler)
                  for sig in (signal.SIGTERM, signal.SIGHUP): signal.signal(sig, signal.SIG_DFL)
                  receipt['cancelled'] = CANCELLED
                  passed = (receipt['setup']['status'] == 'PASS' and all(s['status'] == 'PASS' for s in receipt['stages'].values()) and
                            receipt['category'] is None and receipt['source_preserved'] is True and receipt['cleanup'] and not CANCELLED)
                  receipt['status'] = 'PASS' if passed else 'FAIL'
                  if not passed and receipt['category'] is None:
                      receipt['category'] = 'CANCELLED' if CANCELLED else 'CLEANUP' if not receipt['cleanup'] else 'STAGE_FAILED'
                  try:
                      write_receipt(receipt_path, receipt)
                  except BaseException:
                      write_receipt(receipt_path, {'schemaVersion': 1, 'status': 'FAIL', 'category': 'RECEIPT_CAP_OR_WRITE',
                          'setup': {'status': 'UNKNOWN'}, 'stages': {n: {'status': 'UNKNOWN'} for n in ('unit','lock','osv')},
                          'source_files': {}, 'source_preserved': receipt['source_preserved'], 'tools': {}, 'cleanup': receipt['cleanup'], 'cancelled': CANCELLED,
                          'hosted_dependabot_updater': 'NOT_RUN'})
                      passed = False
              return 0 if passed else 1


          if __name__ == '__main__':
              raise SystemExit(main())
          PY
      - name: Upload sanitized receipt after owned cleanup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-dependency-audit-receipt
          path: ${{ runner.temp }}/trueid-python-dependency-audit.json
          if-no-files-found: error
          retention-days: 7
