          PYTHON = '/app/integrations/sycope/.venv/bin/python'
          PROJECT_FILES = ('scripts/audit-python-lock.py', 'scripts/test_audit_python_lock.py',
                           'integrations/sycope/uv.lock', 'integrations/sycope/pyproject.toml')
          CANCELLED = False
          UNCERTAIN = False
          ENV = None
          INTENTS = []


          class Failure(Exception):
              def __init__(self, code): self.code = code


          def need(ok, code):
              if not ok: raise Failure(code)


          def digest(raw): return hashlib.sha256(raw).hexdigest()
          def canonical(value): return json.dumps(value, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()


          def interrupted(_number, _frame):
