# cargo-deny configuration for TrueIDv2.
#
# Resolved 2026-10-26: jsonwebtoken now uses the aws_lc_rs backend.
# rsa (RUSTSEC-2023-0071) and crypto-bigint (RUSTSEC-2026-0387) are absent
# from the lock and selected all-target graph; unfiltered cargo-audit passed.
#
# Resolved 2026-08-31 (no longer in graph; notes kept for history):
# - RUSTSEC-2025-0134 rustls-pemfile: direct usage migrated to
#   rustls-pki-types; last transitive copy dropped by axum-server 0.8.
# - RUSTSEC-2024-0370 proc-macro-error: dropped by tabled 0.21 — its
#   successor fork proc-macro-error2 (RUSTSEC-2026-0173, unmaintained) was
#   in turn dropped by tabled 0.22 (tabled_derive 0.12) on 2026-09-23.

[graph]
all-features = true

[advisories]
unmaintained = "all"
ignore = [
    # Temporary: sqlx-sqlite 0.9.0 selects libsqlite3-sys >=0.30.1,<0.38.0, so the
    # patched 0.39.x line (SQLite 3.54.x; RUSTSEC-2026-0459 / CVE-2026-119375) is
    # not selectable yet. The flaw requires a locally crafted database plus sibling
    # -wal file opened by the victim. Remove this entry once a sqlx release allows
    # libsqlite3-sys >= 0.39 (check with: cargo update -p libsqlite3-sys --dry-run).
    "RUSTSEC-2026-0459",
    # Temporary: chrono 0.4.45 is unmaintained (RUSTSEC-2026-0543, published
    # 2026-11-17). No patched release exists; upstream points to jiff or time.
    # Used across the workspace and transitively via sqlx 0.9.0 and radius 0.4.0.
    # Review by 2027-02-21; remove this entry once migrated or a maintained
    # chrono release is available.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
include-dev = true
include-build = true
