# cargo-deny configuration for TrueIDv2.
#
# RUSTSEC-2023-0071 (rsa "Marvin Attack"): since jsonwebtoken's rust_crypto
# backend the rsa crate is compiled for RS256/ES256 ID-token SIGNATURE
# VERIFICATION in OIDC — public-key operations only; TrueID never performs
# rsa private-key operations (signing/decryption), which is what the advisory
# affects. No fixed upstream version exists. Re-review when rsa ships a fix.
#
# Resolved 2026-08-31 (no longer in graph; notes kept for history):
# - RUSTSEC-2025-0134 rustls-pemfile: direct usage migrated to
#   rustls-pki-types; last transitive copy dropped by axum-server 0.8.
# - RUSTSEC-2024-0370 proc-macro-error: dropped by tabled 0.21 — its
#   successor fork proc-macro-error2 (RUSTSEC-2026-0173, unmaintained) was
#   in turn dropped by tabled 0.22 (tabled_derive 0.12) on 2026-09-23.

[advisories]
unmaintained = "none"
ignore = [
    # rsa "Marvin Attack" — see header note: verify-only usage.
    "RUSTSEC-2023-0071",
]
