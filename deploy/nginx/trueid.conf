# TrueID reverse proxy configuration
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
#
# Minimum nginx version: 1.30.7 (stable) or 1.31.9 (mainline).
# This sample enables HTTP/2 (`listen 443 ssl http2`). Official nginx
# 1.9.5-1.31.8 are affected by CVE-2026-123007 (HTTP/2 flow-control
# window overflow / memory corruption; nicknamed nginx2root). Fixed in
# 1.30.7 and 1.31.9, released 18 Nov 2026. After upgrading, fully
# restart nginx or the container; a reload does not replace the
# running binary. Distro packages may backport the fix without
# changing the number shown by `nginx -v` - compare the full package
# version with the distro advisory.
# Sources:
#   https://nginx.org/en/security_advisories.html
#   https://nginx.org/en/CHANGES-1.30
#   https://nginx.org/en/CHANGES
#   https://www.cve.org/CVERecord?id=CVE-2026-123007
#   https://nvd.nist.gov/vuln/detail/CVE-2026-123007
#   https://moje.cert.pl/komunikaty/2026/217/krytyczne-podatnosci-w-serwerze-nginx-umozliwiajace-zdalne-wykonanie-kodu-nginx2root/

upstream trueid_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name trueid.example.com;

    ssl_certificate     /etc/ssl/certs/trueid.pem;
    ssl_certificate_key /etc/ssl/private/trueid-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WebSocket-ready proxy
    location / {
        proxy_pass http://trueid_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Prometheus metrics.
    # Requires a logged-in Viewer+ session or a static METRICS_TOKEN query parameter.
    # Prefer allow/deny rules to limit this path to your monitoring network.
    location /metrics {
        proxy_pass http://trueid_web/metrics;
        # allow 10.0.0.0/8;
        # deny all;
    }

    # Health check (no logging)
    location /health {
        proxy_pass http://trueid_web/health;
        access_log off;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name trueid.example.com;
    return 301 https://$host$request_uri;
}
