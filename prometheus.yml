global:
  scrape_interval: 15s

scrape_configs:
  - job_name: trueid
    metrics_path: /metrics
    # Bearer-header auth (query-string ?token= is deprecated and leaks into logs).
    # Set METRICS_TOKEN in web's environment to the same value.
    authorization:
      type: Bearer
      credentials: "set-a-strong-metrics-token"
    static_configs:
      - targets: ["web:3000"]
